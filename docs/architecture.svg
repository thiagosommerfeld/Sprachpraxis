<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Sprachpraxis Azure architecture</title>
  <desc id="desc">Browser and PWA access an Azure Storage static website and Azure Functions API. Microsoft Entra ID provides optional sign-in. Functions synchronize progress with Cosmos DB and stream audio from a private Blob container. GitHub Actions deploy through OIDC, while Qwen3-TTS audio is manually uploaded from Google Colab through Azure Storage Explorer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#6B4EFF"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#107C10"/>
    </marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#243746}
      .title{font-size:34px;font-weight:700;fill:#172B4D}
      .subtitle{font-size:17px;fill:#526B7A}
      .cloud-label{font-size:15px;font-weight:700;letter-spacing:2px;fill:#0078D4}
      .card{fill:#fff;stroke:#B8D8F2;stroke-width:2}
      .card-title{font-size:19px;font-weight:700;fill:#172B4D}
      .body{font-size:14px;fill:#425B6B}
      .small{font-size:12px;fill:#526B7A}
      .chip{font-size:12px;font-weight:600;fill:#fff}
      .wire{fill:none;stroke:#0078D4;stroke-width:3;marker-end:url(#arrow)}
      .wire-dashed{fill:none;stroke:#6B4EFF;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrowPurple)}
      .wire-green{fill:none;stroke:#107C10;stroke-width:3;marker-end:url(#arrowGreen)}
      .wire-label{font-size:12px;font-weight:600;fill:#315F7D}
      .outside{fill:#fff;stroke:#7A8E9B;stroke-width:2}
      .icon-line{fill:none;stroke:#0078D4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#F3F8FC"/>
  <text x="52" y="62" class="title">Sprachpraxis | Azure Architecture</text>
  <text x="52" y="94" class="subtitle">Static PWA · Optional Microsoft sign-in · Serverless progress API · Private audio delivery</text>

  <!-- Azure environment -->
  <rect x="330" y="130" width="1340" height="680" rx="28" fill="#EAF5FC" stroke="#78B9E7" stroke-width="2"/>
  <rect x="360" y="145" width="110" height="28" rx="14" fill="#0078D4"/>
  <text x="415" y="164" class="chip" text-anchor="middle">MICROSOFT AZURE</text>

  <!-- GitHub Actions -->
  <rect x="48" y="172" width="236" height="126" rx="16" class="outside"/>
  <circle cx="83" cy="211" r="18" fill="#24292F"/>
  <path d="M75 212c0-5 4-9 9-9s9 4 9 9c0 4-2 7-6 8v-4c2 0 3-2 3-4 0-3-2-5-6-5s-6 2-6 5c0 2 1 4 3 4v4c-4-1-6-4-6-8z" fill="#fff"/>
  <text x="111" y="211" class="card-title">GitHub Actions</text>
  <text x="68" y="246" class="body">OIDC federated login</text>
  <text x="68" y="269" class="body">Deploy site + Function App</text>
  <text x="68" y="289" class="small">No long-lived Azure client secret</text>

  <!-- User browser -->
  <rect x="48" y="390" width="236" height="160" rx="16" class="outside"/>
  <rect x="70" y="414" width="53" height="37" rx="4" class="icon-line"/>
  <path d="M96 451v9m-12 0h24M74 421h45" class="icon-line"/>
  <rect x="132" y="412" width="22" height="45" rx="4" class="icon-line"/>
  <circle cx="143" cy="450" r="1.8" fill="#0078D4"/>
  <text x="68" y="486" class="card-title">Learner</text>
  <text x="68" y="512" class="body">Desktop or Android</text>
  <text x="68" y="535" class="small">PWA · Local-first progress</text>

  <!-- Deployment wires behind the Azure cards -->
  <path d="M284 222 H344 V372 H380" class="wire-green"/>
  <path d="M344 222 H720 V382 H735" class="wire-green"/>
  <text x="360" y="211" class="wire-label" fill="#107C10">OIDC deployment</text>

  <!-- Browser request path -->
  <path d="M284 462 H380" class="wire"/>
  <text x="306" y="449" class="wire-label">HTTPS</text>
  <path d="M650 474 H735" class="wire"/>
  <text x="660" y="459" class="wire-label">API calls</text>

  <!-- Azure Storage Static Website -->
  <rect x="390" y="380" width="260" height="180" rx="16" class="card"/>
  <rect x="390" y="380" width="260" height="9" rx="4" fill="#0078D4"/>
  <rect x="414" y="412" width="42" height="42" rx="8" fill="#E6F4FB"/>
  <path d="M423 422h24v5h-24zm0 9h24v5h-24zm0 9h24v5h-24z" fill="#0078D4"/>
  <text x="470" y="429" class="card-title">Azure Storage</text>
  <text x="414" y="480" class="body">Static Website · $web</text>
  <text x="414" y="504" class="body">HTML, CSS, JavaScript, PWA</text>
  <text x="414" y="535" class="small">Public website files only</text>

  <!-- Optional identity redirect -->
  <path d="M520 380 V330 H840 V315" class="wire-dashed"/>
  <text x="562" y="322" class="wire-label" fill="#6B4EFF">Optional MSAL sign-in</text>

  <!-- Microsoft Entra ID -->
  <rect x="745" y="185" width="300" height="125" rx="16" class="card"/>
  <rect x="745" y="185" width="300" height="9" rx="4" fill="#6B4EFF"/>
  <circle cx="786" cy="229" r="20" fill="#F0EDFF"/>
  <circle cx="786" cy="222" r="6" fill="#6B4EFF"/>
  <path d="M773 241c1-8 6-12 13-12s12 4 13 12" fill="none" stroke="#6B4EFF" stroke-width="3" stroke-linecap="round"/>
  <text x="820" y="224" class="card-title">Microsoft Entra ID</text>
  <text x="770" y="267" class="body">Optional user sign-in</text>
  <text x="770" y="291" class="small">MSAL token · access_as_user scope</text>

  <!-- Azure Functions -->
  <rect x="745" y="382" width="310" height="228" rx="16" class="card"/>
  <rect x="745" y="382" width="310" height="9" rx="4" fill="#0078D4"/>
  <path d="M783 416l-13 24h13l-5 22 23-30h-14l7-16z" fill="#0078D4"/>
  <text x="820" y="430" class="card-title">Azure Functions</text>
  <text x="770" y="474" class="body">Node.js 22 · HTTP API</text>
  <text x="770" y="500" class="body">/progress · /audio · /sentences</text>
  <rect x="770" y="520" width="225" height="30" rx="15" fill="#E8F3FB"/>
  <text x="882" y="540" class="small" text-anchor="middle">Easy Auth principal + scope check</text>
  <text x="770" y="582" class="small">/tts route exists; not the active audio path</text>

  <!-- Cosmos DB -->
  <path d="M1055 449 H1130 V360 H1200" class="wire"/>
  <text x="1070" y="438" class="wire-label">Progress JSON</text>
  <rect x="1210" y="280" width="350" height="160" rx="16" class="card"/>
  <rect x="1210" y="280" width="350" height="9" rx="4" fill="#0078D4"/>
  <circle cx="1254" cy="327" r="22" fill="none" stroke="#0078D4" stroke-width="3"/>
  <ellipse cx="1254" cy="327" rx="10" ry="22" fill="none" stroke="#0078D4" stroke-width="2"/>
  <path d="M1233 327h42m-37-10h32m-32 20h32" class="icon-line"/>
  <text x="1292" y="325" class="card-title">Azure Cosmos DB</text>
  <text x="1238" y="374" class="body">SprachpraxisDB · Progress</text>
  <text x="1238" y="400" class="body">One document per user</text>
  <text x="1238" y="425" class="small">Partition key: /userId</text>

  <!-- Private Blob audio -->
  <path d="M1055 530 H1130 V586 H1200" class="wire"/>
  <text x="1070" y="518" class="wire-label">Fetch {id}.mp3</text>
  <rect x="1210" y="500" width="350" height="175" rx="16" class="card"/>
  <rect x="1210" y="500" width="350" height="9" rx="4" fill="#00A4EF"/>
  <path d="M1238 536h30l8 8h28v34h-66z" fill="#DFF3FC" stroke="#0078D4" stroke-width="2"/>
  <path d="M1246 546h49" stroke="#0078D4" stroke-width="2"/>
  <text x="1315" y="546" class="card-title">Azure Blob Storage</text>
  <text x="1238" y="590" class="body">Private container: phrase-audio</text>
  <text x="1238" y="616" class="body">s-0001.mp3 · {sentence-id}.mp3</text>
  <text x="1238" y="649" class="small">Function streams audio to browser</text>

  <!-- Optional Azure Speech endpoint -->
  <path d="M900 610 V645" class="wire-dashed"/>
  <rect x="745" y="650" width="310" height="112" rx="16" fill="#FAF9FF" stroke="#B8AAF9" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M773 690v20m8-29v38m8-31v24m8-34v44" stroke="#6B4EFF" stroke-width="3" stroke-linecap="round"/>
  <text x="820" y="691" class="card-title">Azure Speech</text>
  <text x="770" y="727" class="body">Optional /tts endpoint</text>
  <text x="770" y="749" class="small">Not connected to current playback flow</text>

  <!-- Audio creation and upload workflow -->
  <text x="52" y="874" class="cloud-label">OFFLINE AUDIO AUTHORING</text>
  <rect x="48" y="898" width="320" height="132" rx="16" class="outside"/>
  <rect x="70" y="924" width="44" height="44" rx="8" fill="#FCE8E6"/>
  <path d="M82 939h20l-10-9zm-4 10h28v3H78zm4 7h20v3H82z" fill="#E8710A"/>
  <text x="130" y="945" class="card-title">Google Colab</text>
  <text x="70" y="992" class="body">Qwen3-TTS batch generation</text>
  <text x="70" y="1016" class="small">German speech · MP3 by sentence ID</text>

  <path d="M368 964 H425" class="wire"/>
  <rect x="425" y="898" width="250" height="132" rx="16" class="outside"/>
  <path d="M450 928h38v44h-38z" fill="#EAF5FC" stroke="#0078D4" stroke-width="2"/>
  <path d="M458 940h22m-22 8h22m-22 8h16" stroke="#0078D4" stroke-width="2"/>
  <text x="500" y="945" class="card-title">Download ZIPs</text>
  <text x="450" y="992" class="body">100 clips per batch</text>
  <text x="450" y="1016" class="small">Extract MP3s on the PC</text>

  <path d="M675 964 H735" class="wire"/>
  <rect x="735" y="898" width="360" height="132" rx="16" class="outside"/>
  <rect x="760" y="925" width="42" height="36" rx="4" fill="none" stroke="#0078D4" stroke-width="3"/>
  <path d="M760 935h42m-32 9h22m-22 8h22" class="icon-line"/>
  <text x="820" y="945" class="card-title">Azure Storage Explorer</text>
  <text x="760" y="992" class="body">Manual upload to phrase-audio</text>
  <text x="760" y="1016" class="small">MP3s stay outside GitHub</text>

  <path d="M1095 964 H1710 V588 H1560" class="wire-green"/>
  <text x="1305" y="949" class="wire-label" fill="#107C10">Upload clips to private Blob container</text>

  <text x="52" y="1092" class="small">Audio playback remains available without sign-in. Progress synchronization requires Microsoft sign-in.</text>
  <text x="52" y="1120" class="small">Azure Storage Static Website is distinct from Azure Static Web Apps.</text>
</svg>

