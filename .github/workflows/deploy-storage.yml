name: Publicar site no Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Entrar no Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enviar os arquivos do site ao contêiner $web
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          for file in sprachpraxis-c1.html audio-config.js frases_antigas.json manifest.webmanifest sw.js icon.svg; do
            case "$file" in
              *.html) CONTENT_TYPE="text/html" ;;
              *.js) CONTENT_TYPE="application/javascript" ;;
              *.json) CONTENT_TYPE="application/json" ;;
              *.webmanifest) CONTENT_TYPE="application/manifest+json" ;;
              *.svg) CONTENT_TYPE="image/svg+xml" ;;
            esac

            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name '$web' \
              --name "$file" \
              --file "$file" \
              --content-type "$CONTENT_TYPE" \
              --overwrite true
          done